syntax = "proto3";
package ibeam_rawpanel;

option go_package = "./ibeam_rawpanel;ibeam_rawpanel";


// Generally, if a field of another message type is not nil
// that whole message with all it's fields (except other messages) shall be accepted as values (including default false/zeros)

// Wrapper for all incoming messages (Incoming = to Panel from System)
message InboundMessage {
    enum FlowMsg {
        NONE = 0;
        PING = 1;   // "ping",
        ACK = 2;    // "ack",
        NACK = 3;   // "nack",
    }
    FlowMsg FlowMessage = 1;    // Only non-zero values are acted upon

    Command Command = 2;

    repeated HWCState States = 8;   // These "States" is feedback to components such as color, display content etc.
    repeated Register Registers = 9;    // Setting registers (works like feedback States, but not for any physical components, internal memory locations rather. Use SendRegisters to see which registers exists)
}

// All the bools in the Command section is like a trigger when true
message Command {
    bool ActivatePanel = 1; // "ActivePanel=1",
    bool SendPanelInfo = 2; // "list",
    bool SendPanelTopology = 3; // "PanelTopology?",
    bool SendRegisters = 50;    // Sends register values
    // bool SendHWCStates = 51;    // Sends activation states of HWC components in return (current value of fader, joystick, button)
    bool ReportHWCavailability = 4; // "map" -> "avail"
    bool SendBurninProfile = 6; // Return the burnin json profiles of a controller (Only for ibeam panels)
    bool SendCalibrationProfile = 34; // Return the calibration json profiles of a controller
    bool SendNetworkConfig = 36; // Ask panel to return the network configuration of a panel (if applicable)
    NetworkConfig SetNetworkConfig = 37; // Set and activate network configuration (if applicable)

    bool ClearAll = 10; // "Clear",
    bool ClearLEDs = 11; // "ClearLEDs",
    bool ClearDisplays = 12;    // "ClearDisplays",
    
    bool WakeUp = 5;   // "WakeUp!",
    
    bool GetSleepTimeout = 20;  // "SleepTimer?",
    SleepTimeout SetSleepTimeout = 21;  // SleepTimer=xx
    SleepMode SetSleepMode = 28;  // SleepMode=xx
    SleepScreenSaver SetSleepScreenSaver = 29;  // SleepScreenSaver=xx

    WebserverState SetWebserverEnabled = 22;    // Webserver=x

    Brightness PanelBrightness = 23;        // PanelBrightness=x,y  (or x,y,z incl. the screen backlight)

    HeartBeatTimer SetHeartBeatTimer = 24;  // HeartBeatTimer=
    bool GetConnections = 25;  // "Connections?",
    DimmedGain SetDimmedGain = 26;  // DimmedGain=
    bool GetRunTimeStats = 27;  // "RunTimeStats?"

    PublishSystemStat PublishSystemStat = 30;
    LoadCPU LoadCPU = 31;
    bool Reboot = 32;   // "Reboot",
    JSONconfig JSONconfig = 33; // Configuration of JSON handling in ASCII mode

    CalibrationProfile SetCalibrationProfile = 35;
    Environment SimulateEnvironmentalHealth = 40;

    TouchUIConfig SetTouchUI = 41;      // "SetTouchUI={json}" - set (replace) the TouchUI widget configuration
    bool ClearTouchUI = 42;             // "ClearTouchUI" - remove all TouchUI widgets, revert to native topology
    bool SendTouchUICapabilities = 43;  // "TouchUICapabilities?" - ask panel for screen + widget-type capabilities
    bool SendTouchUIConfig = 44;        // "TouchUIConfig?" - ask panel to (re)send the currently active TouchUI config (multi-client sync)
    TouchUISetActivePage SetTouchUIActivePage = 45; // "SetTouchUIActivePage=N" - switch the currently displayed page/tab at runtime
}
message JSONconfig {
    bool Outbound = 1;  // All Command messages
}
message Register {
    enum RegisterE {
        MEM = 0;
        FLAG = 1;
        SHIFT = 2;
        STATE = 3;
    }
    RegisterE Reg = 1;
    string Id = 2;
    uint32 Value = 3;
}
message SleepTimeout {
    uint32 Value = 1;
}
message SleepMode {
    enum SlpMode {
        FIREWORKS = 0;
        OFF = 1;
    }
    SlpMode Mode = 1;
}
message SleepScreenSaver {
    enum SlpScrSaver {
        WAKEUPONKEYPRESS = 0;   // "Wake Up On Key Press" message (default)
        SHEEPANDGOATS = 1;  // Classic UniSketch funtime screen saver, counting sheep and goats
        SAVETHEOLEDS = 2;   // "Save The Oleds" message
        JUSTDIMMED = 3; // keeps content, dims buttons and panel
    }
    SlpScrSaver Type = 1;
}
message WebserverState {
    bool Enabled = 1;
}
message HeartBeatTimer {
    uint32 Value = 1;
}
message DimmedGain {
    uint32 Value = 1;
}
message Brightness {
    uint32 OLEDs = 1;
    uint32 LEDs = 2;
    // Screen backlight of a panel that has an LCD (touch panels), on the same 0-8
    // scale as LEDs/OLEDs. 0 turns the backlight fully off. `optional` because
    // absence ("a client older than this field: leave the screen alone") must stay
    // distinguishable from 0 ("turn it off"). Panels without a screen ignore it.
    optional uint32 Screen = 3;
}

message PublishSystemStat {
    uint32 PeriodSec = 2; // Disabled when 0
}

message LoadCPU {
    enum LevelE {
        OFF = 0;
        ON_1CORE = 1;
        ON_2CORES = 2;
        ON_3CORES = 3;
        ON_4CORES = 4;
    }
    LevelE Level = 1;
}

message HWCState {
    repeated uint32 HWCIDs = 1;

    HWCMode HWCMode = 2;                // HWC#xx=yy
    HWCColor HWCColor = 3;              // HWCc#xx=yy
    HWCExtended HWCExtended = 4;        // HWCx#xx=yy
    HWCText HWCText = 5;                // HWCt#xx=yy
    HWCGfx HWCGfx = 6;                  // HWCg#xx=yy   + HWCgRGB#xx=yy+ HWCgGray#xx=yy

    PublishRawADCValues PublishRawADCValues = 7;
    // 8 was temporarily used for HWCGfxConverter which has never been used by anyone, but we avoid it...
    Processors Processors = 9;
    HWCOverlay HWCOverlay = 10;         // "HWCo#xx={json}" - dynamic overlay boxes (e.g. tracking rectangles on a TouchUI VIDEO widget)
    HWCJog HWCJog = 11;                 // HWCj#xx=yy - complete configuration of a haptic jog wheel
}

message Processors {
    // These may be mutually exclusive:
    ProcGfxConverter GfxConv = 1;    // Convert and scale PNC/JPEG/GIF image input for display. Will generate and override the HWCGfx object and clear itself and HWCText afterwards
    ProcAudioMeter AudioMeter = 2;    // Create audio meter from integer data. Will generate and override the HWCGfx object and clear itself and HWCText afterwards
    ProcTextToGraphics TextToGraphics = 3;    // Converts the HWCText object to HWCGfx. Will generate and override the HWCGfx object and clear itself and HWCText afterwards
    ProcStrength StrengthMeter = 4; // Create strength meter (for T-bar for example). Will generate and override the HWCGfx object and clear itself and HWCText afterwards
    ProcTest Test = 5; // Test: Creates a bounding box with the given dimensions and writes them inside. Will generate and override the HWCGfx object and clear itself and HWCText afterwards
    ProcUniText UniText = 6; // Alternative Text object that renders UTF8 text by default using the Unifont.ttf
    ProcIcon Icon = 7; // Create an icon based on a glyph from Googles Material Icons font. Will generate and override the HWCGfx object and clear itself and HWCText afterwards
}

message PublishRawADCValues {
    bool Enabled = 1;
}

// HWC#xx=yy
// Changes from UniSketch TCP Client/RawPanel 1.0:
// Blink bit 4 is left out in v2.0 - legacy
message HWCMode {
    enum StateE {
        OFF = 0;
        ON_YELLOW = 1;  // Actually shall be Amber
        ON_RED = 2;
        ON_GREEN = 3;
        ON = 4;
        DIMMED = 5;
      }
    StateE State = 2;           // Intensity for LEDs, mixed up with the three special colors red, green, amber (full on)
    bool Output = 4;            // Digital output on/off (like relays). This should (probably) always follow State values 1-4 = true, 0 and 5 (anything else) = false
    uint32 BlinkPattern = 3;    // Blink pattern, 4 bits
}

// Extended state of hardware component
message HWCExtended {
    enum InterpretationE {
        NONE = 0;
        STRENGTH = 1;
        STEPS = 3;
        VU = 4;
        FADER = 5;
        BUZZER = 6;
        JOG = 7;
      }
    InterpretationE Interpretation = 2;      // Value type
    uint32 Value = 3;    // Value, 10 bits
}

// HWCj#xx=yy
// Complete configuration of a haptic jog wheel. Sending it replaces the wheel's entire
// configuration - there are no sub-commands and no ordering requirements, so mode, detents
// and target position can always travel together in a single message.
//
// Supersedes the bit-packed HWCExtended(JOG) sub-command encoding, which remains supported
// for older controllers but must not be extended further.
//
// Panel obligations:
//   - Apply Mode/AutoStopShuttle/StopShuttle/DetentsPerRev FIRST, then seek TargetPosition.
//     Because the mode is applied earlier in the same message, a position write can never be
//     rejected for "wheel not in a motorized mode".
//   - Treat re-sends idempotently: fields that did not change since the last applied
//     configuration must NOT re-trigger reconfiguration of the wheel. Clients are expected to
//     stream position updates with the configuration attached to every message.
message HWCJog {
    enum ModeE {
        DETENTS_LIGHT = 0;
        DETENTS_W_ASSIST = 1;
        DETENTS = 2;
        DETENTS_MIX1 = 3;
        DETENTS_MIX2 = 4;
        FREE = 5;
        FREE_W_ASSIST = 6;
        STOP = 7;
        STOP_FULL = 8;
        SHUTTLE = 9;
        VOLUME_KNOB = 10;       // Motor controlled, seekable via TargetPosition
        VOLUME_KNOB_BUMP = 11;  // ...with simulated end-bumps
      }

    // Absolute target for the motor. A submessage rather than a bare scalar so that
    // "do not drive the motor" stays distinguishable from "seek to 0".
    message TargetPositionM {
        uint32 Value = 1;       // 0-1000
    }

    ModeE Mode = 1;                 // Haptic operating mode
    bool AutoStopShuttle = 2;       // SHUTTLE only: automatically stop the shuttle
    bool StopShuttle = 3;           // SHUTTLE only: allow stopping/holding the shuttle
    uint32 DetentsPerRev = 4;       // Modes 0-6 only, 2-255. 0 = keep the panel default (about 25)
    TargetPositionM TargetPosition = 5;  // VOLUME_KNOB / VOLUME_KNOB_BUMP only. Absent = do not drive the motor
}

// Color.
// Could have used "oneof" but disliked because of the extra convolution
// colorRGB takes precedence over colorIndex
message HWCColor {
    // One of:
    ColorRGB ColorRGB = 1;
    ColorIndex ColorIndex = 2;
}

// Color, but used in HWCText. Same as HWCColor
message Color {
    // One of:
    ColorRGB ColorRGB = 1;
    ColorIndex ColorIndex = 2;
}

// Color as RGB (3x2 bits)
message ColorRGB {
    uint32 Red = 1;
    uint32 Green = 2;
    uint32 Blue = 3;
}

// Color as a name/index:
message ColorIndex {
    enum Colors {
        DEFAULT = 0;
        OFF = 1;
        WHITE = 2;
        WARM = 3;
        RED = 4;
        ROSE = 5;
        PINK = 6;
        PURPLE = 7;
        AMBER = 8;
        YELLOW = 9;
        DARKBLUE = 10;
        BLUE = 11;
        ICE = 12;
        CYAN = 13;
        SPRING = 14;
        GREEN = 15;
        MINT = 16;
        LIGHTGRAY = 17; // For displays / backgrounds
        DARKGRAY = 18; // For displays / backgrounds
    }

    Colors Index = 1;
}

// Text
message HWCText {
    sint32 IntegerValue = 2;    // Index 0
    enum FormattingE {
        FMT_INTEGER = 0;
        FMT_FLOAT_2DEZ = 1; 
        FMT_PERCENTAGE = 2;
        FMT_DB = 3;
        FMT_FRAMES = 4;
        FMT_ONEOVERX = 5;
        FMT_KELVIN = 6;
        FMT_HIDE = 7;
        FMT_FLOAT_X_XXX = 8;
        FMT_FLOAT_XX_XX = 9;
        FMT_ONELINE = 10;
        FMT_TWOLINES = 11;
        FMT_FLOAT_XXX_X = 12;
    }
    FormattingE Formatting = 3;    // Index 1
    
    enum StateIconE {
        SI_NONE = 0;
        SI_FINE = 1;
        SI_LOCK = 2;
        SI_NOACCESS = 3;
    }
    StateIconE StateIcon = 5;       // Index 2

    enum ModifierIconE {
        MI_NONE = 0;
        MI_CYCLE = 1;
        MI_DOWN = 2;
        MI_UP = 3;
        MI_HOLD = 4;
        MI_TOGGLE = 5;
        MI_OK = 6;
        MI_QUESTION = 7;
    }
    ModifierIconE ModifierIcon = 6;       // Index 2

    string Title = 7;                   // Index 3
    bool SolidHeaderBar = 8;            // Index 4
    string Textline1 = 9;               // Index 5
    string Textline2 = 10;              // Index 6
    sint32 IntegerValue2 = 11;            // Index 7

    enum PairModeE {
        PM_OFF = 0;
        PM_UNMARKED = 1;
        PM_UPPER_MARKED = 2;
        PM_LOWER_MARKED = 3;
        PM_BOTH_MARKED = 4;
    }
    PairModeE PairMode = 12;              // Index 8

    message ScaleM {
        enum ScaleTypeE {
            ST_OFF = 0;
            ST_STRENGTH = 1;
            ST_CENTER_MARKER = 2;
            ST_CENTER_BAR = 3;
        }
        ScaleTypeE ScaleType = 1;              
        sint32 RangeLow = 2;
        sint32 RangeHigh = 3;
        sint32 LimitLow = 4;
        sint32 LimitHigh = 5;
    }
    ScaleM Scale = 13;         // Index 9-13
        // 14 is ignored

    message TextStyle {
        message Font {
            enum FontFaceE {
                ST_DEFAULT = 0;
                ST_BOLD = 1;
                ST_TINY = 2;
            }
            FontFaceE FontFace = 1;              
            uint32 TextHeight = 2;
            uint32 TextWidth = 3;
        }
        Font TitleFont = 1;        
        Font TextFont = 2;         
        bool FixedWidth = 3;
        uint32 TitleBarPadding = 4;
        uint32 ExtraCharacterSpacing = 5;
        uint32 UnformattedFontSize = 6;
    }
    TextStyle TextStyling = 14;     // Index 15-17
    
    bool Inverted = 15;             // Index 18
    Color PixelColor = 16;          // Index 19
    Color BackgroundColor = 17;     // Index 20
}

// Graphics
message HWCGfx {
    enum ImageTypeE {
        MONO = 0;
        RGB16bit = 1;
        Gray4bit = 2;
    }
    ImageTypeE ImageType = 1;    
    uint32 W = 2;       // Must always be set (and match size of image in ImageData)
    uint32 H = 3;       // Must always be set (and match size of image in ImageData)

    // TODO: Break this optional parameter out into separate message:
    bool XYoffset = 4;  // Enables whether the X/Y offset is taken into account (default is to center the image)
    uint32 X = 5;
    uint32 Y = 6;

    bytes ImageData = 16;
}

// Dynamic overlay rectangles drawn on top of a widget's content - primarily tracking boxes on a
// TouchUI VIDEO widget (see TouchUIWidget). Semantics: each HWCOverlay message is a FULL REPLACEMENT
// of the addressed HWC's overlay set; send an empty Boxes list to clear. Panels shall support at
// least 16 boxes per HWC. ASCII form: "HWCo#xx={json}" (JSON encoding of this message).
// Boxes contributed by TouchUIMarker HWCs are drawn IN ADDITION to this set and are not affected by
// it: the two are separate mechanisms for the same picture, one whole-set and one box-at-a-time, so
// a client using either cannot clear the other's boxes out from under it.
message HWCOverlay {
    message Box {
        uint32 Id = 1;      // Client-assigned box id (stable across updates for the same tracked object)
        uint32 X = 2;       // 0..1000, normalized within the widget's content rect
        uint32 Y = 3;       // 0..1000
        uint32 W = 4;       // 0..1000
        uint32 H = 5;       // 0..1000
        Color Color = 6;    // Border/label color. Unset = panel default
        string Label = 7;   // Optional short caption rendered at the box
    }
    repeated Box Boxes = 1;
}

// Image conversion and scaling processor
message ProcGfxConverter {
    enum ImageTypeE {
        MONO = 0;
        RGB16bit = 1;
        Gray4bit = 2;
    }
    ImageTypeE ImageType = 1;    
    uint32 W = 2;       
    uint32 H = 3;       

    bytes ImageData = 16;

    enum ScalingE {
        NONE = 0;
        FILL = 1;   // 
        FIT = 2;    // 
        STRETCH = 3;   // 
    }
    ScalingE Scaling = 18;
    string Filters = 19;
}

message ProcAudioMeter {
    enum MeterTypeE {
        Free = 0;
        Fixed176x32 = 1;
        Fixed176x32w = 2;
    }
    MeterTypeE MeterType = 1;    

    uint32 W = 2;       
    uint32 H = 3;       

    string Title = 4;
    bool Mono = 5;
    string RangeMapping = 6;
    bool RMYAxis = 7;

	uint32 Data1 =10;
	uint32 Data2 =11;
	uint32 Peak1 =12;
	uint32 Peak2 =13;
}

message ProcStrength {
    //    MeterTypeE MeterType = 1;    

    uint32 W = 2;       
    uint32 H = 3;       

    string Title = 4;
    string ValueString = 5;
    string RangeMapping = 6;
    bool RMYAxis = 7;
	uint32 Data1 =10;
}

message ProcTextToGraphics {
    uint32 W = 2;       
    uint32 H = 3;       
    uint32 Border = 4;       
    uint32 Shrink = 5;       
}

message ProcTest {
    uint32 W = 2;       
    uint32 H = 3;       
}

message ProcUniText {
    uint32 W = 2;       
    uint32 H = 3;       

    string Title = 7;                   
    bool SolidHeaderBar = 8;            
    string Textline1 = 9;               
    string Textline2 = 10;              
    string Textline3 = 11;              
    string Textline4 = 12;    
    
    enum AlignTypeE {
        CENTER = 0;
        LEFT = 1;
        RIGHT = 2;
    }
    AlignTypeE Align = 1;  
}

message ProcIcon {
    uint32 W = 2;       
    uint32 H = 3;       

    enum ImageTypeE {
        MONO = 0;
        RGB16bit = 1;
        Gray4bit = 2;
    }
    ImageTypeE IconType = 1;    

    string GlyphCode = 10;    
    uint32 GlyphSize = 9;           
    bool Background = 7;  
    uint32 BackgroundRadius = 8;           
}

  

// Wrapper for all outgoing messages (Outgoing = from Panel to System)
message OutboundMessage {
    enum FlowMsg {
        NONE = 0;
        PING = 1;   // "ping",
        ACK = 2;    // "ack",
        NACK = 3;   // "nack",
        BSY = 4;    // "BSY",
        RDY = 5;    // "RDY",

        HELLO = 100;    // Hi there, I'm a panel!
    }
    FlowMsg FlowMessage = 1;

    // Value semantics: 0 = component absent/disabled.
    // Non-zero = present; the low 31 bits carry legacy content (1 or the mapped-to HWC id).
    // Bit 31 (0x80000000) = present but OFFSCREEN (e.g. a TouchUI widget on a non-visible tab/page).
    // Panels report visibility changes simply by re-sending map entries for the affected HWCs.
    map<uint32, uint32> HWCavailability = 2;

    PanelInfo PanelInfo = 4;
    PanelTopology PanelTopology = 5;
    BurninProfile BurninProfile = 9;
    
    SleepTimeout SleepTimeout = 6;
    SleepState SleepState = 7;

    BusStatus BusStatus = 10;

    repeated HWCEvent Events = 8;
    // repeated HWCEvent HWCStates = 36;  // States of components (current value of a joystick, fader or button/gpi. Encoders obviously cannot report state of pulses...). Sent in response to SendHWCStates

    Connections Connections = 20;
    HeartBeatTimer HeartBeatTimer = 21;
    DimmedGain DimmedGain = 22;
    RunTimeStats RunTimeStats = 23;
    SystemStat SysStat = 24;

    Message Message = 30;
    Message ErrorMessage = 31;

    Environment EnvironmentalHealth = 32;

    repeated Register Registers = 33;

    CalibrationProfile CalibrationProfile = 34;
    CalibrationProfile DefaultCalibrationProfile = 35;

    NetworkConfig NetworkConfig = 37; // Get network configuration (if applicable)

    TouchUICapabilities TouchUICapabilities = 38;   // Response to Command.SendTouchUICapabilities
    TouchUIConfig TouchUIConfig = 39;               // Response to Command.SendTouchUIConfig (echo of the currently active config)
}

message SleepState {
    bool IsSleeping = 1;
}

message Connections {
    repeated string Connection = 1;
}

message Message {
    string Message = 1;
}

message Environment {
    RunModeE RunMode = 1;
    enum RunModeE {
        NORMAL = 0;
        SAFEMODE = 1;   // In safemode, all operations are maintained, but additional checks are done which could potentially be felt as performance degrations. Safemode should still lead to a warning to the users that their product is in a compromising environment.
        BLOCKED = 2;    // 
    }
}

message RunTimeStats {
    uint32 BootsCount = 1;
    uint32 TotalUptime = 2;
    uint32 SessionUptime = 3;
    uint32 ScreenSaveOnTime = 4;
}

message BusStatus {
    bool Fault = 1;
}

message HWCEvent {
    uint32 HWCID = 1;
    uint32 Timestamp = 6;   // Systems time in milliseconds the moment of the trigger

    // one of:
    BinaryEvent Binary = 2;
    PulsedEvent Pulsed = 3;
    AbsoluteEvent Absolute = 4;
    SpeedEvent Speed = 5;

    // Vector events carries multiple values, for example a X/Y of a joystick that goes together or X/Y movement on a track pad or track ball.
    // A vector event may be sent along with a normal one-dimensional event - typically the first axis of something like a joystick.
    // BinaryVectorEvent BinaryVector = 8;
    // PulsedVectorEvent PulsedVector = 9;
    AbsoluteVectorEvent AbsoluteVector = 10;    // e.g. a TouchUI XYPAD position [x, y]
    SpeedVectorEvent SpeedVector = 11;          // e.g. a TouchUI XYPAD relative movement [dx, dy]

    // A future multi-touch/XY TouchEvent should use field 12 (fields 8-11 stay reserved for the Vector events above)

    TextEvent Text = 13;    // a string the user entered on the panel, e.g. an editable TouchUI LABEL commit

    RawAnalogEvent RawAnalog = 7;
}

message BinaryEvent {
    enum EdgeID {
        UNKNOWN = 0;    // No edge = 1-way button
        TOP = 1;
        LEFT = 2;
        BOTTOM = 4;
        RIGHT = 8;
        ENCODER = 16;
    }

    bool Pressed = 1;
    EdgeID Edge = 2;
}

message PulsedEvent {
    sint32 Value = 1;
}

message AbsoluteEvent {
    uint32 Value = 1;
    uint32 PrevValue = 2;   // Can hold previously sent value
    // float ValueNorm = 3; // Normalized value 0.0:1.0. Not supported in basic ASCII mode
    // float PrevValueNorm = 4; // Normalized previous value 0.0:1.0. Not supported in basic ASCII mode
}

message SpeedEvent {
    sint32 Value = 1;
    sint32 PrevValue = 2;   // Can hold previously sent value
    // float ValueNorm = 3; // Normalized value -1.0:1.0. Not supported in basic ASCII mode
    // float PrevValueNorm = 4; // Normalized previous value -1.0:1.0. Not supported in basic ASCII mode
}

// message BinaryVectorEvent {
//     enum EdgeID {
//         UNKNOWN = 0;    // No edge = 1-way button
//         TOP = 1;
//         LEFT = 2;
//         BOTTOM = 4;
//         RIGHT = 8;
//         ENCODER = 16;
//     }

//     repeated bool Pressed = 1;
//     EdgeID Edge = 2;
// }

// message PulsedVectorEvent {
//     repeated sint32 Value = 1;
// }

// AbsoluteVectorEvent carries several absolute axes that belong together (e.g. an XYPAD [x, y]).
// ASCII form is the multi-value variant of a scalar Abs event: "HWC#id=Abs:x,y" (single-value "Abs:v" still parses).
message AbsoluteVectorEvent {
    repeated uint32 Value = 1;        // e.g. [x, y], each 0..1000
    repeated uint32 PrevValue = 2;    // Can hold previously sent values
    // repeated float ValueNorm = 3; // Normalized values 0.0:1.0. Not supported in basic ASCII mode
    // repeated float PrevValueNorm = 4; // Normalized previous values 0.0:1.0. Not supported in basic ASCII mode
}

// SpeedVectorEvent carries several relative axes that belong together (e.g. an XYPAD in relative mode [dx, dy]).
// ASCII form: "HWC#id=Speed:dx,dy" (single-value "Speed:v" still parses).
message SpeedVectorEvent {
    repeated sint32 Value = 1;        // e.g. [dx, dy]
    repeated sint32 PrevValue = 2;    // Can hold previously sent values
    // repeated float ValueNorm = 3; // Normalized values -1.0:1.0. Not supported in basic ASCII mode
    // repeated float PrevValueNorm = 4; // Normalized previous values -1.0:1.0. Not supported in basic ASCII mode
}

// TextEvent carries a string the user entered on the panel - today, an editable TouchUI LABEL
// (TouchUIWidgetOptions.EditKind) committing what was typed on the panel's on-screen keyboard.
// It has no numeric arm on purpose: a NUMBER-kind field sends its digits verbatim, so a client
// parses exactly the kind it asked for and never has to guess whether it was handed a number.
// ASCII form: "HWC#id=Text:<value>". The value is the entire rest of the line, so it needs no
// escaping at all - commas, colons and '=' survive verbatim. An empty value is legal and means
// the user cleared the field. The panel MUST NOT emit CR or LF inside the value, since the
// ASCII transport is line-oriented; encoders replace them defensively.
message TextEvent {
    string Value = 1;
}

message RawAnalogEvent {
    uint32 Value = 1;
}

message SystemStat {
    uint32 CPUUsage = 1; // 0..100%
    float CPUTemp = 2; // degrees Celsius
    float ExtTemp = 3; // degrees Celsius, external sensor (-100 if not available)
    float CPUVoltage = 4; // CPU voltage
    sint32 CPUFreqCurrent = 5; // CPU current frequency (-1 if not available) 
    sint32 CPUFreqMin = 6; // CPU min frequency (-1 if not available)
    sint32 CPUFreqMax = 7; // CPU max frequency (-1 if not available)
    sint32 MemTotal = 8; // total memmory in kB 
    sint32 MemFree = 9; // free memmory 
    sint32 MemAvailable = 10; // available memmory
    sint32 MemBuffers = 11; // buffered
    sint32 MemCached = 12; // cached
    bool UnderVoltageNow = 13; // Under voltage condition detected now, under-voltage occurs when voltage drops below 4.63V. The Pi is throttled
    bool UnderVoltage = 14; //  Under voltage condition detected since boot
    bool FreqCapNow = 15; // Frequency cap reached now , arm frequency capped occurs with temp > 80'C
    bool FreqCap = 16; // Frequency cap reached since boot 
    bool ThrottledNow = 17; // CPU Throttling now , over-temperature occurs with temp > 85'C. The Pi is throttled
    bool Throttled = 18; // CPU Throttled since boot
    bool SoftTempLimitNow = 19; //
    bool SoftTempLimit = 20; //
}

message PanelInfo { //  Values only used if not empty
    string Model = 1;
    string Serial = 2;
    string Name = 3;
    string SoftwareVersion = 4; // Depends on context...
    string Platform = 5;    // "core" = device core, "ibeam" = bluepill products, "xpanel" = external panel, "simulator"...?
    bool BluePillReady = 6; // Early version of support description, more details would be inside RawPanelSupport.
    uint32 MaxClients = 7;
    repeated string LockedToIPs = 8;

    enum PanelTypeE {
        UNKNOWN = 0;
        BLUEPILLINSIDE = 1;   // Physical panel; All SKAARHOJ panels on Blue Pill
        PHYSICAL = 2;   // Other physical panel; StreamDeck, XKeys, Joysticks etc.
        EMULATION = 3;    // Simulated software panel: Raw Panel Dummies, Raw Panel Device Core
        TOUCH = 4;  // Touch screen panel
        COMPOSITE = 5; // Composite panel of other panels - eg. Monopanel
    }
    PanelTypeE PanelType = 9;

    RawPanelSupport RawPanelSupport = 10;
}

message RawPanelSupport {
    bool ASCII = 10; // Whether ASCII protocol mode is available
    bool Binary = 11; // Whether binary protobuf protocol mode is available
    bool ASCII_JSONfeedback = 12; // Whether ASCII mode supports JSON encoded state feedback messages in addition to normal encoding
    bool ASCII_Inbound = 13; // Whether ASCII mode exclusively JSON decodes all feedback messages (has to be enabled by JSONconfig)
    bool ASCII_Outbound = 14; // Whether ASCII mode exclusively JSON encodes all command messages (has to be enabled by JSONconfig)

    bool Processors = 15; // Whether Processors for Image Conversion, meter widgets, text with UTF-8 is available on the panel
    bool System = 16; // Whether system features like SystemStat and CPU is available (limited to physical Blue Pill panels)
    bool RawADCValues = 17; // Whether raw ADC values are available (limited to physical Blue Pill panels)
    bool BurninProfile = 18; // Whether a burn-in profile is supported (limited to physical Blue Pill panels + emulator)
    bool EnvHealth = 19; // Whether environmental health is reported (physical Blue Pill panels + emulator)
    bool Registers = 20; // Whether registers are supported
    bool Calibration = 21; // Whether calibration is available. Shall only be reported if calibration is unlocked!
    // bool HWCStates = 22; // Whether HWC states can be quiryed using SendHWCStates
    // bool NormalizedValues = 23;  // Whether Normalized Values are supported for absolute and intensity HWCs.
    bool NetworkSettings = 24; // Whether network settings can be controlled over Raw Panel protocol
    bool TouchUI = 25; // Whether TouchUI widget configuration (SetTouchUI et al.) is supported
    bool JogConfig = 26; // Whether the HWCJog message is supported (otherwise only the legacy bit-packed HWCExtended(JOG) encoding)
}

message PanelTopology { //  Values only used if not empty
    string Svgbase = 1;
    string Json = 2;
}

message BurninProfile {
    string Json = 1;
}

message CalibrationProfile {
    string Json = 1;
}

message NetworkConfig {
    bool dhcp = 1;
    string address = 2;
    string netmask = 3;
    string gateway = 4;
    string first_dns = 5;
    string second_dns = 6;
    bool no_default_route = 7;
  }

// TouchUI: A client can send a TouchUIConfig (Command.SetTouchUI) to a touch-capable panel which will render
// the declared widgets. Widgets are addressed as regular HWCs with client-assigned HWC ids: they emit standard
// HWCEvents (Binary/Pulsed/Absolute) and honor standard HWCStates (HWCMode/HWCColor/HWCText/HWCExtended/HWCGfx).
//
// Behavioral contract: After accepting SetTouchUI, the panel regenerates its PanelTopology.Json to include one
// TopologyHWcomponent per widget (Id = widget HWCID, Txt = Label, TypeIndex entry with In/Out/Disp matching the
// widget type, e.g. BUTTON -> In:"b", SLIDER -> In:"av", VIDEO -> In:"b" plus a Disp entry sized to the region)
// and one Topology Grid per page, then spontaneously re-sends PanelTopology and the full HWCavailability map.
// This makes widgets fully visible to generic clients.
// ClearTouchUI reverts topology and marks widget HWCs absent (availability value 0).
//
// Visibility: widgets on a non-visible tab/page are reported via HWCavailability with bit 31 set
// (see OutboundMessage.HWCavailability).
message TouchUIConfig {
    string Title = 1;                   // Optional overall title
    repeated TouchUIPage Pages = 2;     // Tabs/pages. A single page = no tab bar.
    uint32 ActivePage = 3;              // 1-based id of page to show initially. 0 = panel default (first page).
    TouchUIGlobalOptions Options = 4;   // Optional panel-wide render/diagnostic overlays. Absent = all off (clean screen).
}

// TouchUIGlobalOptions are panel-wide options that travel with a config: the panel applies them
// the moment it accepts the SetTouchUI, and they persist for the life of that config. Most of them
// control only diagnostic/feedback overlays the renderer draws on top of the widgets, never widget
// behavior; the exceptions are DisableConfigMenu (panel chrome) and DisplayOrientation (which way
// up the whole UI is rendered). An absent message (or an all-zero one) means every overlay is off
// - a clean screen - with the config menu available and the orientation left to the panel.
message TouchUIGlobalOptions {
    // Center touch readout ("touches: N", last pixel + normalized coordinates). Off = hidden.
    bool ShowDebugInfo = 1;

    // On-touch tap indicator (the live crosshair that follows a finger, plus optional pinned dots).
    enum ShowTapsE {
        NO    = 0;      // no tap indicator at all
        YES   = 1;      // live crosshair only, follows the finger, gone on release
        KEEP3 = 2;      // live crosshair plus the last 3 tap points left pinned on screen
    }
    ShowTapsE ShowTaps = 2;

    // Video FPS / per-camera arrival-rate stats line (bottom-left). Off = hidden.
    bool ShowVideoFPS = 3;

    // Hide the panel's built-in configuration menu (the top-right cogwheel giving access to
    // system settings like network, wifi, support mode and reboot). Note the inverted polarity
    // relative to the other options here: absent/false = menu available (the default), true =
    // cogwheel hidden and menu inaccessible for the life of this config.
    bool DisableConfigMenu = 4;

    // Keep the config menu but hide its Reactor section (project switching, device management,
    // warnings) and stop the panel's Reactor monitoring. Implied by DisableConfigMenu.
    bool DisableReactorConfigMenu = 5;

    // Which way up the UI is rendered, as a clockwise rotation relative to the panel's normal
    // (as-mounted) orientation - NOT relative to the display's scanout, which the panel owns.
    // ROT0 is therefore "however this panel normally sits", whatever its build does internally.
    enum DisplayOrientationE {
        AUTO   = 0;     // the panel decides: it tracks its accelerometer if it has one, else ROT0
        ROT0   = 1;     // normal orientation
        ROT90  = 2;     // a quarter turn clockwise
        ROT180 = 3;     // upside down
        ROT270 = 4;     // a quarter turn counter-clockwise
    }
    // Absent/AUTO is the default and the only self-adjusting value; any other value pins the
    // orientation for the life of this config and suspends accelerometer tracking. On a ROT90/
    // ROT270 the screen's width and height swap, so the panel spontaneously re-sends its
    // TouchUICapabilities (as it does after a SetTouchUI) and a client using pixel layout should
    // re-send a config that fits. Grid layouts reflow by themselves. Panels that cannot rotate
    // ignore this entirely and report TouchUICapabilities.OrientationSupported = false.
    DisplayOrientationE DisplayOrientation = 6;
}

// Command.SetTouchUIActivePage switches the currently displayed page/tab at runtime, without
// re-sending the whole config. The panel updates HWCavailability accordingly (widgets on the
// newly hidden page get bit 31 set, those on the shown page cleared), so all clients observe
// the switch. PageId must be a 1-based id present in the active config; an unknown id is ignored.
message TouchUISetActivePage {
    uint32 PageId = 1;                  // 1-based page id to display
}

message TouchUIPage {
    uint32 Id = 1;                      // 1-based page id, unique within the config
    string Title = 2;                   // Tab label
    uint32 GridRows = 3;                // If >0 (with GridCols) widgets are laid out in a grid (Row/Col/spans used)
    uint32 GridCols = 4;
    repeated TouchUIWidget Widgets = 5;
}

// Widget ability masks (shared between TouchUIWidget.EventMask and TouchUIWidgetTypeCap):
// EventMask: bit0 = Binary, bit1 = Pulsed, bit2 = Absolute, bit3 = Speed, bit4 = Vector (Absolute/Speed carried as a *Vector event, e.g. XYPAD),
//            bit5 = Text (a string value, e.g. an editable LABEL commit)
// StateMask: bit0 = HWCMode, bit1 = HWCColor, bit2 = HWCText, bit3 = HWCExtended, bit4 = HWCGfx, bit5 = HWCOverlay
message TouchUIWidget {
    uint32 HWCID = 1;   // Client-assigned HWC id. MUST NOT collide with the panel's native HWC ids.
    enum WidgetTypeE {
        BUTTON = 0;     // momentary push button    -> emits Binary;   honors HWCMode/HWCColor/HWCText/HWCGfx
                        //   With Options.FourWay it is a 4-way pad: taps on the top/left/bottom/right edges emit
                        //   Binary with the matching Edge (TOP/LEFT/BOTTOM/RIGHT); a plain button emits Edge=NONE.
        TOGGLE = 1;     // latching on/off          -> emits Binary;   honors HWCMode/HWCColor/HWCText
        SLIDER = 2;     // linear fader, 0..1000    -> emits Absolute; honors HWCExtended(FADER)/HWCText
        KNOB   = 3;     // rotary fader (analog dial, absolute 0..1000) -> emits Absolute; honors HWCExtended(FADER)/HWCText
        METER  = 4;     // passive meter            -> emits nothing;  honors HWCExtended(VU/STRENGTH)/HWCGfx
        LABEL  = 5;     // text tile                -> emits Binary on tap (unless Options.NoTapEvents); honors HWCText/HWCColor.
                        //   With Options.EditKind != NONE it is instead an EDITABLE FIELD: a tap opens the panel's
                        //   on-screen keyboard seeded with the text the label is currently displaying, and committing
                        //   emits TextEvent. See TouchUIWidgetOptions.EditKind.
        IMAGE  = 6;     // image tile               -> emits Binary on tap (unless Options.NoTapEvents); honors HWCGfx
        VIDEO  = 7;     // live video region        -> emits AbsoluteVector[x,y] (position) or, with Options.Relative,
                        //   SpeedVector[dx,dy]; plus Binary on touch/release (unless Options.NoTapEvents). Honors
                        //   HWCText/HWCColor/HWCOverlay.
                        //   Axes: a video region reports IMAGE coordinates - X is 0 at the LEFT edge and Y is 0 at the
                        //   TOP edge, each 0..1000 within the region. This is deliberately NOT the XYPAD convention
                        //   (Y=0 at the bottom, joystick-style): a tap on a picture and an HWCOverlay box drawn in
                        //   response to it must share one frame of reference, so following a tapped point with a
                        //   tracking box needs no axis flip anywhere. Relative mode uses the same signs (+dy is
                        //   downward) and the same 0..1000-per-edge domain, i.e. deltas are NOT in pixels.
                        //   The source is panel-local (Options.Source spec or the panel's default feeds); the client
                        //   only places the region and optionally decorates it (corner label, overlay/tracking boxes).
                        //   The source can also be retargeted at RUNTIME, without a new SetTouchUI: a non-empty
                        //   HWCText.Textline2 addressed to this widget REPLACES Options.Source for as long as it is
                        //   set (clearing it falls back to the configured source). That makes switching which camera a
                        //   tile shows a matter of ordinary per-HWC feedback rather than a config rebuild, which would
                        //   otherwise restart every widget on the panel.
                        //   Options.Markers declares overlay boxes that are addressable HWCs in their own right (see
                        //   TouchUIMarker). Marker boxes are drawn IN ADDITION to any HWCOverlay set on this widget.
        ENCODER = 8;    // encoder pad (- / press / +) -> emits Pulsed on the -/+ taps and Binary (Edge=ENCODER) on the
                        //   center press; honors HWCText/HWCExtended. The touch-friendly counterpart of a physical
                        //   encoder: left/right taps pulse -1/+1, the center is the push. (KNOB is the analog dial.)
        ROLLER = 9;     // discrete 1-of-N selector -> emits Absolute(selected index, 0..N-1); honors
                        //   HWCExtended(STEPS)=selected index / HWCText. Options.Choices holds the ordered labels.
                        //   HWCText updates the widget's CAPTION only - the choice list is fixed for the life of the
                        //   config (changing it means a new SetTouchUI), so the index domain a client emits against
                        //   can never shift underneath it.
        XYPAD  = 10;    // 2D touch surface         -> emits AbsoluteVector[x,y] (position, each 0..1000) or, with Options.Relative,
                        //   SpeedVector[dx,dy]; plus Binary on touch/release. Honors HWCOverlay (cursor/target markers) / HWCGfx (background).
                        //   Axes: X is 0 at the LEFT edge, Y is 0 at the BOTTOM edge - Y is inverted relative to screen
                        //   scanout, matching a vertical SLIDER and a joystick, so the geometric centre is exactly
                        //   (500,500). Relative mode uses the same signs (+dy is upward) and the same 0..1000-per-edge
                        //   domain as the absolute mode, i.e. deltas are NOT in pixels.
        COMPRESSOR = 11;// dynamics transfer-curve  -> emits nothing itself; drawn from the member fader parameters in Options.Params.
                        //   Each parameter is a standard fader HWC (Absolute out / HWCExtended(FADER) in), individually automatable.
                        //   The COMPRESSOR is a single topology component; its member HWCIDs are known only to compressor-aware clients.
    }
    WidgetTypeE Type = 2;
    string Label = 3;                   // Static label; runtime content comes via HWCText/HWCGfx states

    // Layout, grid mode (page GridRows/GridCols > 0). 1-based cells:
    uint32 Row = 4;
    uint32 Col = 5;
    uint32 RowSpan = 6;                 // 0 == 1
    uint32 ColSpan = 7;                 // 0 == 1
    // Layout, free mode (page grid == 0). Pixels on the capability-reported screen:
    uint32 X = 8;
    uint32 Y = 9;
    uint32 W = 10;
    uint32 H = 11;

    TouchUIWidgetOptions Options = 12;
    uint32 EventMask = 13;              // Optional override of the events this widget emits (EventMask bits above).
                                        // 0 = the type's default set for the given Options - which is what almost every
                                        // client wants, since the relevant Option already enables the behavior (e.g.
                                        // Options.EditKind turns Text on). A non-zero mask NARROWS: it MUST be a subset
                                        // of TouchUIWidgetTypeCap.EventMask for the type, bits outside it are ignored,
                                        // and it is how a widget suppresses part of its default set (e.g. an editable
                                        // LABEL that should emit its commit but NOT also tap events sets bit5 alone).
}

message TouchUIWidgetOptions {
    sint32 Min = 1;                     // SLIDER/KNOB/METER value range (default 0..1000, matching Absolute events)
    sint32 Max = 2;
    uint32 Step = 3;                    // SLIDER detents / KNOB pulses per revolution hint
    bool Vertical = 4;                  // SLIDER/METER orientation
    Color Color = 5;                    // Accent color; runtime override via HWCColor
    bool NoTapEvents = 6;               // IMAGE/LABEL/VIDEO: suppress Binary tap events
    bool Momentary = 7;                 // TOGGLE rendered but behaving momentary
    bool FourWay = 12;                  // BUTTON: render a 4-way pad; edge taps emit Binary with Edge=TOP/LEFT/BOTTOM/RIGHT

    // ROLLER options:
    repeated string Choices = 13;       // ROLLER: ordered option labels; selected index is emitted as AbsoluteEvent.Value (0-based).
                                        // At most 32 entries of at most 23 bytes each; a label MUST NOT contain a newline.
                                        // Over-long lists/labels are truncated by the panel rather than rejected.

    // XYPAD options:
    bool Relative = 14;                 // XYPAD: emit SpeedVector[dx,dy] deltas instead of AbsoluteVector[x,y] position
    bool CenterReturn = 15;             // XYPAD: joystick behavior - snap back to center (500,500) on release.
                                        // Meaningless (and rejected) together with Relative: a delta pad has no position to return to.

    // COMPRESSOR options:
    repeated TouchUICompressorParam Params = 16;   // COMPRESSOR: member fader parameters that define the transfer curve.
                                        // At most 6 entries, each with a distinct Role.

    // LABEL options - turn a passive text tile into a tap-to-edit field:
    enum EditKindE {
        NONE     = 0;                   // passive label (the default)
        TEXT     = 1;                   // full alphanumeric keyboard
        NUMBER   = 2;                   // numeric keyboard
        IP       = 3;                   // digits and dots only
        PASSWORD = 4;                   // masked entry; never seeded with the displayed value
    }
    EditKindE EditKind = 17;            // LABEL only. Non-NONE makes the tile tappable: the panel opens its on-screen
                                        // keyboard seeded with the text the label is CURRENTLY DISPLAYING (whatever the
                                        // last HWCText put there; PASSWORD seeds empty) and, on commit, emits TextEvent
                                        // under this widget's HWCID. Cancelling emits nothing. The panel does NOT update
                                        // the label itself on commit - the client remains the source of truth and echoes
                                        // the value it accepted back via HWCText. Implies the Text bit in EventMask.
    uint32 EditMaxLen = 18;             // LABEL: max input length in bytes. 0 = panel default (47); capped at 63.

    // VIDEO options:
    string Source = 8;                  // Source spec, interpreted by the panel (e.g. "/dev/video0", "yuyv:<dev>",
                                        // "mjpg:<dev>", "http://host/stream" MJPEG). EMPTY = the panel's local
                                        // default feed N, where N is this widget's 1-based ordinal among VIDEO
                                        // widgets in config order - so remote clients need no device knowledge.
    enum HiddenPolicyE {                // What the panel does with the source while the widget is offscreen
        KEEP_DECODING = 0;              //   keep streaming + decoding (instant switch)
        PAUSE_DECODE = 1;               //   stay connected, skip decode (cheap, near-instant)
        DISCONNECT = 2;                 //   close the source; reopen when shown again
    }
    HiddenPolicyE HiddenPolicy = 9;
    uint32 SourceWidth = 10;            // Capture hints (0 = source default)
    uint32 SourceHeight = 11;
    repeated TouchUIMarker Markers = 19;// VIDEO: overlay boxes that are addressable HWCs of their own. At most 8 per
                                        // widget and 16 per config (the per-HWC overlay box floor).
}

// TouchUIMarker is one overlay box on a VIDEO widget that is addressable as an HWC in its own right, so an ordinary
// per-HWC feedback can position it. It exists because HWCOverlay is a whole-set message: a client that can only emit
// standard per-HWC state (text/color/mode) has no way to contribute ONE box to a widget it shares with others. A
// marker turns each box into its own HWC, which such a client can drive with nothing but a text feedback.
//
// A marker emits no events. It consumes, under its own HWCID:
//   HWCText.Textline1  the box geometry, as "x,y" or "x,y,w,h" - decimal integers, comma separated, each 0..1000
//                      normalized within the VIDEO widget's content rect (the same domain and, per WidgetTypeE.VIDEO,
//                      the same axes as a touch on that widget). The "x,y" form takes W/H below. Anything that does
//                      not parse - including the empty string - HIDES the box rather than drawing it somewhere
//                      arbitrary, which is what makes it safe to point a general-purpose text feedback at a marker.
//   HWCText.Title      box caption. Empty leaves the box unlabelled.
//   HWCColor           box color, overriding Color below.
//   HWCMode.State=OFF  hides the box, so visibility is a condition like any other feedback.
message TouchUIMarker {
    uint32 HWCID = 1;                   // Addressable HWC for this box. MUST NOT collide with any widget, compressor
                                        // member or other marker id.
    uint32 W = 2;                       // Box size 0..1000, used when Textline1 gives only "x,y" (0 = panel default)
    uint32 H = 3;
    Color Color = 4;                    // Default border/label color. Unset = panel default; HWCColor overrides.
    bool Centered = 5;                  // Interpret x,y as the box CENTRE rather than its top-left corner. The natural
                                        // form for a reticle following a tracked point or a tap.
}

// TouchUICompressorParam is one member parameter of a COMPRESSOR widget (see TouchUIWidget.WidgetTypeE.COMPRESSOR).
// Each parameter is a standard fader HWC in its own right: it emits Absolute under its HWCID and is set from the
// system via HWCExtended(FADER) under the same id, so it stays individually addressable and automatable. Role tells
// the panel how to place/draw the corresponding handle on the transfer curve; Min/Max give the parameter's natural
// range (in its unit), linearly mapped onto the Absolute 0..1000 domain.
message TouchUICompressorParam {
    uint32 HWCID = 1;                   // Addressable fader HWC for this parameter (own events/states). MUST NOT collide with other HWC ids.
    enum RoleE {
        THRESHOLD = 0;                  // dB
        RATIO     = 1;                  // n:1
        KNEE      = 2;                  // dB (knee width)
        MAKEUP    = 3;                  // dB
        ATTACK    = 4;                  // ms
        RELEASE   = 5;                  // ms
    }
    RoleE  Role  = 2;
    sint32 Min   = 3;                   // Natural-unit range mapped to Absolute 0..1000 (0/0 = panel default for the role)
    sint32 Max   = 4;
    string Label = 5;                   // Optional parameter caption, at most 15 bytes (else the panel uses a role default)
}

// TouchUICapabilities is normally the answer to Command.SendTouchUICapabilities, but a panel that
// can rotate also sends it spontaneously whenever its orientation changes - ScreenWidth/ScreenHeight
// and the grid recommendation swap with it, so this is how a client learns it must re-lay-out.
message TouchUICapabilities {
    uint32 ScreenWidth = 1;             // pixels, in the orientation currently rendered
    uint32 ScreenHeight = 2;
    uint32 MaxPages = 3;                // 0 = unlimited/unknown
    uint32 MaxWidgets = 4;              // total, 0 = unlimited/unknown
    uint32 GridRows = 5;                // native/preferred grid geometry (0 = free-layout only)
    uint32 GridCols = 6;
    repeated TouchUIWidgetTypeCap WidgetTypes = 7;  // supported widget types + their abilities
    bool OrientationSupported = 8;      // the panel can render in more than one orientation
                                        // (TouchUIGlobalOptions.DisplayOrientation is honored)
    TouchUIGlobalOptions.DisplayOrientationE CurrentOrientation = 9;  // the orientation in effect
                                        // right now; a resolved value, never AUTO
}

message TouchUIWidgetTypeCap {
    TouchUIWidget.WidgetTypeE Type = 1;
    uint32 EventMask = 2;               // The UNION of everything this type can emit across all Options combinations -
                                        // NOT what a default widget of the type emits. Per-widget enablement is the
                                        // relevant Option (e.g. LABEL advertises Text here, but a widget only emits it
                                        // when Options.EditKind != NONE); per-widget narrowing is TouchUIWidget.EventMask.
    uint32 StateMask = 3;               // StateMask bits this type honors (see TouchUIWidget)
}
